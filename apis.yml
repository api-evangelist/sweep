- name: Sweep MCP Server
  description: Sweep's official hosted Model Context Protocol server — a remote SSE endpoint at https://sweepmcp.com/sse
    that connects a Sweep-governed view of Salesforce and connected enterprise systems to MCP clients such as Claude.
    Authorization is OAuth 2.0 with dynamic client registration and PKCE, advertised via RFC 8414 authorization-server
    metadata at https://sweepmcp.com/.well-known/oauth-authorization-server. Included in Sweep's Platform tier and
    above.
  humanURL: https://help.sweep.io/en/articles/11432955-using-the-sweep-mcp-server
