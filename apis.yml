apis:
- name: Sweep API
  description: Sweep's public REST API — the contract behind the Sweep agentic workspace. 698 operations across
    591 paths covering CRM org connection and metadata (Salesforce, HubSpot, Snowflake, ServiceNow, Workato, Data360),
    the documentation platform (element search, dependencies, dependents, summaries, source and per-element chat),
    AI retrievers and AI agents, automations, funnels and funnel maps, assignment groups, territories, rollups,
    scheduling, campaigns, deployments, projects, comments and MCP connectors. Bearer JWT authentication; JSON request
    and response bodies; served from api.sweep.io with a public Swagger UI at /api and the machine-readable document
    at /api-json.
