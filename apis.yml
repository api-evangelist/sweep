aid: sweep
name: Sweep
description: >-
  Sweep is the agentic layer for enterprise systems. By connecting to platforms
  like Salesforce, Snowflake, ServiceNow, and HubSpot, Sweep reads live metadata
  and gives AI agents the context they need to understand, plan, and govern
  changes safely across complex systems. It unifies discovery, design, and build
  into one continuous workflow — auto-generating living documentation of every
  flow, field, and rule; visualizing end-to-end business processes; running
  metadata agents that audit and optimize org configuration; and shipping
  Salesforce automations, lead routing, alerts, and deduplication without custom
  code. Sweep also publishes an official Model Context Protocol (MCP) server that
  connects Salesforce context to AI assistants such as Claude and ChatGPT. Sweep
  is backed by Bessemer Venture Partners, Homebrew, and Insight Partners.
