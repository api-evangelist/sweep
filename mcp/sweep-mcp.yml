name: Sweep MCP
summary: Sweep's official hosted MCP server. It exposes a Sweep-governed view of Salesforce and connected
  enterprise systems to MCP clients, marketed as "the missing layer that connects Salesforce to Claude
  and ChatGPT". The endpoint is live and reachable; the tool list is behind OAuth.
