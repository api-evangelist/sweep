entitlement: Listed as a Platform-tier and above feature on https://www.sweep.io/pricing.
capabilities:
- Query Salesforce pipeline health in natural language
- Retrieve conversion rates and sales velocity
- Surface governed insights and metadata context from connected systems
tools: []
tools_status: gated
tools_note: 'tools/list could not be enumerated: POST to https://sweepmcp.com/sse returns HTTP 401 invalid_token
  without an OAuth access token, and Sweep publishes no tool list in its docs ("the Sweep MCP server displays
  the number of tools Claude can access" is as specific as the help article gets). Left empty rather than
  fabricated — real input schemas require authenticated introspection with a Sweep Platform-tier account.'
related_rest_surface:
  note: 'The REST API at https://api.sweep.io carries first-class MCP plumbing of its own: GET /mcp/apikey
    issues a temporary API key (MCPController_getTemporaryApikey), and an 8-operation "MCP Connectors"
    surface lets a Sweep account register OUTBOUND third-party MCP servers, run their OAuth, and set per-tool
    policies.'
  operations:
  - MCPController_getTemporaryApikey[0]
  - MCPController_getTemporaryApikey[1]
  - McpConnectorsController_getConnectors
  - McpConnectorsController_createConnector
  - McpConnectorsController_getOAuthAuthorizationUrl
  - McpConnectorsController_handleOAuthCallback
  - McpConnectorsController_deleteConnector
  - McpConnectorsController_getConnectionTools
  - McpConnectorsController_updateConnectionToolPolicies
  - McpConnectorsController_deleteConnection
