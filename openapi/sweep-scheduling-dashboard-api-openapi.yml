    put:
      operationId: SchedulingDashboardController_updateIntegrationSettings
      parameters:
      - name: crmOrgId
        required: true
        in: query
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationSettingsDto'
      responses:
        '200':
          description: ''
