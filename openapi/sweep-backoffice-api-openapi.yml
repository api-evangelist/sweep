      - account
      - type
      - accountRoles
      - orgRoles
      - createdById
      - createdBy
      - createdAt
      - updatedById
      - updatedBy
      - updatedAt
      - name
    SalesforceEventMonitoringLogExportDto:
      type: object
      properties: {}
    UpdatePlanDto:
      type: object
      properties: {}
    RoleGroupOrgRole:
      type: object
      properties:
        role:
