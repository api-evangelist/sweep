        defaultCrmOrg:
          $ref: '#/components/schemas/CrmOrg'
        createdById:
          type: string
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          format: date-time
          type: string
        updatedById:
          type: string
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          format: date-time
          type: string
        version:
          type: number
        isPinned:
          type: boolean
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FunnelMapSection'
        funnels:
