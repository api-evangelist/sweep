openapi: 3.2.0
info:
  title: Sweep CRM Orgs API
  description: This is a publicly available Sweep API.
  version: '0.1'
  contact: {}
servers:
- url: https://api.sweep.io
  description: Sweep production API — the host this document was harvested from (GET /api-json); /health responds here
tags:
- name: CRM Orgs
paths:
  /crm-orgs:
    get:
      operationId: CrmOrgsController_getOrgs
      parameters:
      - name: connectedOnly
        required: true
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      security:
      - bearer: []
      tags:
      - CRM Orgs
  /crm-orgs/new:
    post:
      operationId: CrmOrgsController_createOrgs
      parameters:
      - name: demo
        required: true
        in: query
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmOrgCreateDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
      - bearer: []
      tags:
      - CRM Orgs
