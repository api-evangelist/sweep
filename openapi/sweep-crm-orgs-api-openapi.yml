components:
  schemas:
    CrmOrgCreateDto:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
          enum:
          - salesforce
        isSandbox:
          type: boolean
        isMain:
          type: boolean
        customEca:
          $ref: '#/components/schemas/CustomEcaDto'
      required:
      - name
      - platform
      - isSandbox
    FunnelsAndRecordTypesDto:
      type: object
      properties:
        orgId:
          type: string
        activeOnly:
          type: boolean
        objectsData:
          type: array
          items:
            type: object
      required:
      - orgId
      - activeOnly
      - objectsData
    CrmOrgUpdateDto:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    CustomEcaDto:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
      required:
      - clientId
      - clientSecret
    CrmOrgUserTimeOff:
      type: object
      properties:
        id:
          type: string
        type:
          enum:
          - TIME_OFF
          - SNOOZE
          type: string
        description:
          type: string
        startDate:
          format: date-time
          type: string
        endDate:
          format: date-time
          type: string
        timezone:
          type: string
      required:
      - id
      - type
      - description
      - startDate
      - endDate
      - timezone
    CrmOrgOAuthDto:
      type: object
      properties:
        crmOrgId:
          type: string
        authCode:
          type: string
        isSandbox:
          type: boolean
        isOnboardingFastFetch:
          type: boolean
      required:
      - crmOrgId
      - authCode
      - isSandbox
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
